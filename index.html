<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Sonic Metrics | Enterprise Scheduling Infrastructure</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-light: #f0f6ff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --success: #10b981;
        }
  body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-page);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER BRANDING AREA */
        header {
            background: #ffffff;
            padding: 30px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.02em;
        }
.region-badge {
            font-size: 0.8rem;
            font-weight: 700;
            background: var(--accent-light);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .main-container {
            max-width: 1160px;
            margin: 50px auto;
            padding: 0 25px;
        }

        /* COMMERCIAL VALUE PROP HERO SECTIONS */
        .hero-section {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 50px auto;
        }
 .hero-section h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.04em;
            margin-bottom: 15px;
        }

        .hero-section p {
            font-size: 1.15rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0;
        }

        /* TWO-COLUMN PACKAGING FRAMEWORK */
        .product-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 35px;
            margin-bottom: 60px;
        }

        @media (max-width: 900px) {
            .product-grid { grid-template-columns: 1fr; }
        }
         .panel-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .panel-card h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0 0 20px 0;
        }

        .feature-row {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            text-align: left;
        }
        
        .feature-check {
            color: var(--success);
            font-weight: bold;
            font-size: 1.2rem;
            line-height: 1;
        }

        .feature-info h4 {
            margin: 0 0 4px 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .feature-info p {
            margin: 0;
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* ACCOUNT TIERS BOX */
        .pricing-tier {
            background: var(--bg-page);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: left;
        }
        .pricing-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .pricing-note {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        .checkout-anchor {
            display: block;
            text-align: center;
            background: var(--success);
            color: #ffffff;
            text-decoration: none;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            transition: background 0.15s ease;
        }

        .checkout-anchor:hover {
            background: #059669;
        }

        /* HIGH-END WHITE-LABEL INTERACTIVE ENGINE FRAME */
        .engine-showcase {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: 340px 1fr;
            min-height: 580px;
            overflow: hidden;
        }

        @media (max-width: 850px) {
            .engine-showcase { grid-template-columns: 1fr; }
        }

        /* APPLICATION LAYER SIDEBAR */
        .app-sidebar {
            padding: 45px;
            border-right: 1px solid var(--border);
            background: var(--bg-card);
            text-align: left;
        }
         @media (max-width: 850px) {
            .app-sidebar { border-right: none; border-bottom: 1px solid var(--border); padding: 35px; }
        }

        .app-meta-brand {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .app-meta-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0 0 15px 0;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }
        .app-meta-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .app-meta-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0;
        }

        /* EXPERT DYNAMIC WEB CALENDAR SECTION */
        .app-calendar-canvas {
             display: grid;
            grid-template-columns: 1fr;
            transition: grid-template-columns 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--bg-card);
        }

        .app-calendar-canvas.expanded {
            grid-template-columns: 1.1fr 0.9fr;
        }

        @media (max-width: 650px) {
            .app-calendar-canvas.expanded { grid-template-columns: 1fr; }
        }

        .calendar-picker-box {
            padding: 45px;
            display: flex;
            flex-direction: column;
        }

        .calendar-month-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .calendar-month-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .calendar-nav-arrow {
            background: transparent;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        .calendar-nav-arrow:hover {
            background: var(--bg-page);
            color: var(--primary);
        }
.calendar-days-matrix {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            text-align: center;
        }

        .matrix-header-cell {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            padding-bottom: 12px;
            text-transform: uppercase;
        }

        .matrix-day-cell {
            background: transparent;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
             transition: all 0.1s ease;
        }

        .matrix-day-cell:hover:not(.disabled) {
            background: var(--accent-light);
            color: var(--accent);
        }

        .matrix-day-cell.active-selected {
            background: var(--accent) !important;
            color: #ffffff !important;
            font-weight: 700;
        }

        .matrix-day-cell.disabled {
            color: #cbd5e1;
            cursor: not-allowed;
        }

        /* PREMIUM FLUID SLIDE-OUT TIME INCREMENTS PANEL */
        .allocation-time-panel {
            border-left: 1px solid var(--border);
            padding: 45px 25px;
            display: none;
            flex-direction: column;
            background: var(--bg-card);
            max-height: 580px;
             text-align: left;
        }

        @media (max-width: 650px) {
            .allocation-time-panel { border-left: none; border-top: 1px solid var(--border); max-height: none; }
        }

        .allocation-time-panel.visible {
            display: flex;
        }

        .time-panel-header-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .time-panel-scrollable-stack {
            overflow-y: auto;
            display: flex;
