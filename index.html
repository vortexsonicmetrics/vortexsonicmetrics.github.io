<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Sonic Metrics | Enterprise Scheduling Infrastructure</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-light: #f0f6ff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-page: #f1f5f9;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --success: #10b981;
            --bubble-radius: 24px;
            --pill-radius: 12px;
        }
body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-page);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: var(--bg-card);
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-text {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.02em;
        }

        .region-badge {
            font-size: 0.8rem;
            font-weight: 700;
background: var(--accent-light);
            color: var(--accent);
            padding: 6px 16px;
            border-radius: var(--bubble-radius);
        }

        .main-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* FLEX BUBBLE CARD WRAPPERS */
        .bubble-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--bubble-radius);
            padding: 35px;
            box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.04);
            margin-bottom: 30px;
            text-align: left;
        }
 .bubble-card h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0 0 15px 0;
            letter-spacing: -0.02em;
        }

        .bubble-card p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0 0 25px 0;
        }

        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .feature-bubble {
            display: flex;
            gap: 12px;
            background: #fafafa;
            padding: 16px 20px;
            border-radius: var(--pill-radius);
            border: 1px solid var(--border);
        }
         .feature-check {
            color: var(--success);
            font-weight: bold;
        }

        .feature-info h4 {
            margin: 0 0 2px 0;
            font-size: 1rem;
            font-weight: 700;
        }

        .feature-info p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .pricing-bubble {
            background: var(--bg-page);
            border-radius: var(--pill-radius);
            padding: 20px;
            margin-bottom: 25px;
        }
         .pricing-value {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary);
        }

        .checkout-bubble-btn {
            display: block;
            text-align: center;
            background: var(--success);
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: var(--pill-radius);
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .checkout-bubble-btn:hover {
            background: #059669;
            transform: scale(1.01);
        }

        /* ------------------------------------------------ */
        /* VERTICAL FLEX BUBBLE CANDIDTIME SCHEDULER MATRIX */
        /* ------------------------------------------------ */
        .showcase-heading {
            text-align: left;
            margin: 40px 0 15px 10px;
        }

        .showcase-heading h3 {
            margin: 0 0 4px 0;
            font-size: 1.3rem;
            font-weight: 800;
        }

        .showcase-heading p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .vertical-engine-bubble {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--bubble-radius);
            padding: 35px;
            box-shadow: 0 20px 40px -20px rgba(0,0,0,0.06);
            display: flex;
             flex-direction: column;
            gap: 30px;
        }

        .mission-bubble {
            background: var(--accent-light);
            border: 1px solid #dbeafe;
            padding: 25px;
            border-radius: var(--pill-radius);
            text-align: left;
        }

        .mission-bubble h4 {
            margin: 0 0 8px 0;
            color: var(--accent);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
        }

        .mission-bubble p {
            margin: 0;
            font-size: 0.95rem;
            color: #1e3a8a;
            line-height: 1.6;
        }
/* VERTICAL CALENDAR MATRIX TOP LAYER */
        .calendar-layer {
            width: 100%;
        }

        .month-bubble-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #fafafa;
            padding: 10px 20px;
            border-radius: var(--bubble-radius);
            border: 1px solid var(--border);
        }

        .month-bubble-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .arrow-bubble {
            background: #ffffff;
            border: 1px solid var(--border);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        .arrow-bubble:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .days-bubble-matrix {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .bubble-header-cell {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            padding-bottom: 5px;
        }
        .bubble-day-cell {
            background: #ffffff;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .bubble-day-cell:hover:not(.disabled) {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
        }

        .bubble-day-cell.active-bubble {
            background: var(--accent) !important;
            color: #ffffff !important;
            border-color: var(--accent) !important;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
 .bubble-day-cell.disabled {
            color: #cbd5e1;
            background: #f8fafc;
            cursor: not-allowed;
            border-color: #f1f5f9;
        }

        /* VERTICAL TIME SETTING INNER BLOCK STRATEGIES */
        .vertical-time-layer {
            border-top: 1px solid var(--border);
            padding-top: 25px;
            display: none;
            animation: fadeIn 0.25s ease-out;
            text-align: left;
        }

        .vertical-time-layer.visible {
            display: block;
        }

        .time-layer-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
            padding-left: 5px;
        }
         .time-bubble-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        @media (max-width: 550px) {
            .time-bubble-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .bubble-time-node {
            background: #ffffff;
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 12px;
            border-radius: var(--pill-radius);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }

        .bubble-time-node:hover {
            background: var(--success);
            color: #ffffff;
            border-color: var(--success);
             box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
        }

        footer {
            margin-top: 80px;
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border);
            background: #ffffff;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            margin: 0 10px;
        }
