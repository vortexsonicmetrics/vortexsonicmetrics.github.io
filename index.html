<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Infrastructure Portal - Vortex Sonic Metrics LLC</title>
    <style>
        :root {
            --bg-main: #fafafa;
            --surface: #ffffff;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --accent: #0f172a;
            --accent-hover: #1f2937;
  --border: #e5e7eb;
            --success: #10b981;
            --success-bg: #f0fdf4;
            --brand-color: #2563eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: 80px 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .section-wrapper {
            max-width: 760px;
            width: 100%;
            margin-bottom: 35px;
              }

        /* Sophisticated Executive Header */
        .brand-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .corporate-entity {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--text-primary);
            margin: 0;
        }
         .product-subtitle {
            display: inline-block;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--brand-color);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 12px;
            background: #eff6ff;
            padding: 4px 12px;
            border-radius: 4px;
        }

        .description {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 1.05rem;
            max-width: 600px;
            margin: 24px auto 0 auto;
        }

        /* Premium License Activation Module */
        .checkout-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03);
             }

        .checkout-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 6px 0;
        }

        .price-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .price-tag {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.03em;
        }

        .checkout-btn {
            background: var(--accent);
            color: #ffffff;
            padding: 14px 30px;
              border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.15s ease;
        }

        .checkout-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* Minimalist Live Demo Container */
        .demo-section {
            background: var(--surface);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03);
        }

        .section-heading {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
             margin: 0 0 12px 0;
        }

        .demo-instruction {
            margin: 0 0 30px 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Modern Calendar Interface Layout */
        .time-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
             }

        .time-slot-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }
        .time-slot-btn:hover {
            border-color: var(--text-primary);
            background: #fbfbfb;
            transform: translateY(-1px);
        }

        .console-log {
            margin-top: 35px;
            padding: 16px;
            border-radius: 6px;
            background: #f9fafb;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        footer {
            margin-top: 60px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
            border-top: 1px solid var(--border);
            padding-top: 25px;
            width: 100%;
            max-width: 760px;
        }

        footer a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            margin: 0 12px;
        }

        footer a:hover {
            color: var(--text-primary);
            text-decoration: underline;
        }
    </style>
</head>
<body>
